name: HomeBoard
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    tvOS: "17.0"
packages:
  BoardCore:
    path: ../SchoolBoard/BoardCore
targets:
  HomeBoard:
    type: application
    platform: tvOS
    sources:
      - path: HomeBoard
        excludes: [HomeConfig.json]
      - path: HomeBoard/HomeConfig.json
        optional: true
      # The School tab is SchoolBoard's TV board, shared from the sibling folder.
      - path: ../SchoolBoard/SchoolBoard
        group: School
        excludes: [SchoolBoardApp.swift, Assets.xcassets, BoardConfig.json]
      - path: ../SchoolBoard/SchoolBoard/BoardConfig.json
        group: School
        optional: true
    dependencies:
      - package: BoardCore
    entitlements:
      path: HomeBoard/HomeBoard.entitlements
      properties:
        com.apple.developer.homekit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HomeBoard
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSHomeKitUsageDescription: HomeBoard shows your locks, garage, climate, lights and cameras on the TV.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  HomeBoard:
    build:
      targets:
        HomeBoard: all
    run:
      config: Debug
